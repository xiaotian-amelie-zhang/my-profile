<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're In — VÉLO</title>
  <meta name="robots" content="noindex" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='8' fill='%231a1a14'/><text x='32' y='46' font-family='Georgia,serif' font-size='36' font-weight='300' fill='%23b5924a' text-anchor='middle'>V</text></svg>" />

  <meta property="og:title"       content="You're on the VÉLO list." />
  <meta property="og:description" content="First access, founder pricing, and a say in what comes next." />
  <meta property="og:image"       content="https://getvelo.com/og-image.png" />
  <meta name="theme-color"        content="#1a1a14" />

  <script defer data-domain="getvelo.com" src="https://plausible.io/js/script.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,200;0,300;1,200;1,300&family=Inter:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sand:  #f4ede0;
      --stone: #c5b9a7;
      --olive: #49493a;
      --ink:   #1a1a14;
      --gold:  #b5924a;
      --cream: #fdf8f0;
    }

    html, body {
      height: 100%;
      background: var(--ink);
      color: var(--sand);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
    }

    /* Noise */
    body::before {
      content: '';
      position: fixed; inset: 0;
      opacity: 0.03;
      pointer-events: none;
      z-index: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 256px 256px;
    }

    /* Orb */
    body::after {
      content: '';
      position: fixed;
      width: 700px; height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(181,146,74,0.12) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      filter: blur(60px);
      pointer-events: none;
      animation: pulse 6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { transform: translate(-50%,-50%) scale(1);    opacity:0.8; }
      50%      { transform: translate(-50%,-50%) scale(1.12); opacity:1;   }
    }

    nav {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 28px 56px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 300;
      letter-spacing: 0.28em;
      color: var(--stone);
      text-decoration: none;
    }
    .back-link {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--stone);
      text-decoration: none;
      opacity: 0.5;
      transition: opacity 0.2s;
    }
    .back-link:hover { opacity: 1; }

    main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 120px 40px 80px;
    }

    .check {
      width: 56px; height: 56px;
      border-radius: 50%;
      border: 1px solid rgba(181,146,74,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 40px;
      animation: appear 0.6s ease forwards;
    }
    .check svg {
      width: 22px; height: 22px;
      stroke: var(--gold);
      stroke-width: 1.5;
      fill: none;
      stroke-dasharray: 40;
      stroke-dashoffset: 40;
      animation: draw 0.5s 0.4s ease forwards;
    }
    @keyframes appear {
      from { opacity: 0; transform: scale(0.7); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }

    .eyebrow {
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 24px;
      opacity: 0;
      animation: fade-up 0.7s 0.2s ease forwards;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(52px, 8vw, 110px);
      font-weight: 200;
      line-height: 0.95;
      color: var(--sand);
      margin-bottom: 32px;
      opacity: 0;
      animation: fade-up 0.7s 0.35s ease forwards;
    }
    h1 em {
      font-style: italic;
      color: var(--gold);
      display: block;
    }

    .sub {
      font-size: 15px;
      color: var(--stone);
      line-height: 1.85;
      max-width: 380px;
      margin: 0 auto 56px;
      opacity: 0;
      animation: fade-up 0.7s 0.5s ease forwards;
    }

    .divider {
      width: 1px;
      height: 48px;
      background: linear-gradient(to bottom, transparent, rgba(197,185,167,0.3), transparent);
      margin: 0 auto 56px;
      opacity: 0;
      animation: fade-up 0.7s 0.6s ease forwards;
    }

    .share-label {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--stone);
      opacity: 0.5;
      margin-bottom: 20px;
      animation: fade-up 0.7s 0.7s ease forwards;
      opacity: 0;
    }

    .share-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 64px;
      opacity: 0;
      animation: fade-up 0.7s 0.8s ease forwards;
    }

    .share-btn {
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--stone);
      border: 1px solid rgba(197,185,167,0.2);
      padding: 11px 22px;
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s;
      background: transparent;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
    }
    .share-btn:hover { border-color: var(--gold); color: var(--gold); }

    .home-link {
      font-size: 11px;
      letter-spacing: 0.12em;
      color: rgba(197,185,167,0.3);
      text-decoration: none;
      transition: color 0.2s;
      opacity: 0;
      animation: fade-up 0.7s 0.9s ease forwards;
    }
    .home-link:hover { color: var(--stone); }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      nav { padding: 20px 24px; }
      main { padding: 100px 28px 60px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0.01ms !important; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="logo">VÉLO</a>
    <a href="/" class="back-link">← Back</a>
  </nav>

  <main>
    <div class="check">
      <svg viewBox="0 0 24 24"><polyline points="4 12 9 17 20 6"/></svg>
    </div>

    <p class="eyebrow">Waitlist Confirmed</p>

    <h1>You're<br /><em>in.</em></h1>

    <p class="sub">
      We'll reach out before anyone else when VÉLO is ready to ship. First access. Founder pricing. And a say in what comes next.
    </p>

    <div class="divider"></div>

    <p class="share-label">Tell someone</p>

    <div class="share-buttons">
      <a class="share-btn"
         href="https://twitter.com/intent/tweet?text=Just%20joined%20the%20waitlist%20for%20%40getvelo%20%E2%80%94%20SPF50%20mineral%20mist%20that%20actually%20looks%20good.%20getvelo.com&related=getvelo"
         target="_blank" rel="noopener">
        Share on X
      </a>
      <a class="share-btn"
         href="https://www.instagram.com/"
         target="_blank" rel="noopener">
        Instagram
      </a>
      <button class="share-btn" id="copy-btn">Copy Link</button>
    </div>

    <a href="/" class="home-link">Back to getvelo.com</a>
  </main>

  <script>
    document.getElementById('copy-btn').addEventListener('click', function() {
      navigator.clipboard.writeText('https://getvelo.com').then(() => {
        this.textContent = 'Copied ✓';
        setTimeout(() => { this.textContent = 'Copy Link'; }, 2000);
      });
    });
  </script>

</body>
</html>
